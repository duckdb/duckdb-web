schema_version: "0.7"
versions:
  - "v0.1.0"
  - "v0.2.9"
  - "v1.0.0"
  - "v1.2.0"
  - "v1.4.0"
  - "v1.5.0"
  - "v1.5.6"
prefix: "duckdb_"
lifecycle_states:
  stable:
    visibility: always
  deprecated:
    visibility: opt_out
    guard: DUCKDB_API_NO_DEPRECATED
  unstable:
    visibility: opt_in
    guard: DUCKDB_EXTENSION_API_VERSION_UNSTABLE
suffixes:
  handles: ""
  callbacks: ""
  aliases: ""
primitives:
  - name: void
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: i32
    c_type: int32_t
  - name: idx
    c_type: idx_t
    underlying: uint64_t
  - name: state
    c_type: duckdb_state
