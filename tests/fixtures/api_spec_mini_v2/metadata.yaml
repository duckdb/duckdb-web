schema_version: "0.7"
versions:
  - "v2.0.0"
prefix: "duckdb_v2_"
lifecycle_states:
  stable:
    visibility: always
  deprecated:
    visibility: opt_out
    guard: DUCKDB_API_NO_DEPRECATED
  unstable:
    visibility: opt_in
    guard: DUCKDB_EXTENSION_API_VERSION_UNSTABLE
suffixes:
  handles: "_handle"
  callbacks: "_fn"
  aliases: "_t"
primitives:
  - name: void
    c_type: void
  - name: char
    c_type: char
  - name: bool
    c_type: bool
  - name: u32
    c_type: uint32_t
  - name: idx
    c_type: idx_t
    underlying: uint64_t
