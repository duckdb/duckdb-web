<div class="banner yellow" data-banner-version="release-20">
    {% comment %}
    Available color classes: purple, yellow, blue
    Add multiple .banner-item elements to rotate between them every X seconds.
    {% endcomment %}
    <div class="content banner-rotator" data-interval="7">
        <div class="banner-item active">
            <a class="banner-link" href="{% post_url 2026-10-21-announcing-duckdb-200 %}"><span>We released DuckDB 2.0.0, our most feature-packed release ever. Read the announcement and try it out!</span><svg class="icon" aria-hidden="true" focusable="false"><use href="#arrow-right"></use></svg></a>
        </div>
    </div>
    <div class="close"><svg class="icon"><use href="#x"></use></svg></div>
</div>
