<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .duck { fill: #ffd700; }
      .hf { fill: #9b59b6; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; }
      .title { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #666; }
    </style>
  </defs>

  <rect class="bg" width="400" height="200"/>

  <!-- Left side: Duck icon -->
  <circle class="duck" cx="80" cy="100" r="35"/>
  <ellipse class="duck" cx="80" cy="85" rx="28" ry="25"/>
  <path class="duck" d="M 95 75 L 105 70 L 100 80 Z"/>
  <circle cx="85" cy="82" r="4" fill="#333"/>

  <!-- Right side: Text -->
  <text x="160" y="65" class="text title">DuckDB User</text>
  <text x="160" y="95" class="text title">Group Workshop</text>
  <text x="160" y="120" class="text subtitle">AI-Powered Review Analysis</text>
  <text x="160" y="140" class="text subtitle">with Hugging Face</text>
</svg>
