<!doctype html>
<html lang="en" class="darkmode">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
	<title>{{ page.title }} – DuckDB Community Extensions</title>

	<link rel="stylesheet" href="{{ '/css/main.css' | fingerprint }}">
	<link rel="stylesheet" href="{{ '/css/communityextensions_screenshot.css' | fingerprint }}">

	<link rel="icon" type="image/png" href="/images/favicon_ce/favicon-48x48.png" sizes="48x48" />
	<link rel="icon" type="image/svg+xml" href="/images/favicon_ce/favicon.svg" />
	<link rel="shortcut icon" href="/images/favicon_ce/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_ce/apple-touch-icon.png" />
	<link rel="manifest" href="/images/favicon_ce/site.webmanifest" />
	<meta name="theme-color" content="#ffffff">
	<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />

	{% seo title=false %}

</head>

<body class="documentation communityextensions layout_community_extension_sql_screenshot{% if page.body_class %} {{ page.body_class }} {% endif %}">

	{% include icons.html %}
	
	<main>
		
		<div id="ce_screenshot_wrap">
			{% include anchor_headings.html html=content %}
		</div>
			
	</main>
	
	<script>
		document.querySelectorAll('#ce_screenshot_wrap .highlighter-rouge:first-of-type span.k').forEach(function(keyword) {
			var text = keyword.textContent.trim();
			if (text === "FROM") {
				keyword.classList.add('from');
				keyword.before("\n");
			}
			if (text === "LOAD") {
				keyword.before("\n");
			}
		});
	</script>

</body>
</html>
